services:
  - type: web
    name: futliga-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run db:generate && npm run build:api
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: futliga-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://futliga-web.onrender.com
  - type: web
    name: futliga-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://futliga-api.onrender.com
databases:
  - name: futliga-db
    plan: 0.5c-1g
    databaseName: futliga
    user: futliga
